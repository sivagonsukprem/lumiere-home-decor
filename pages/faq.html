<style>
  .faq-list { max-width: 780px; margin: 0 auto; }
  .faq-item { border-bottom: 1px solid var(--color-line); }
  .faq-q { display: flex; justify-content: space-between; align-items: center; padding: 22px 4px; cursor: pointer; font-family: var(--font-serif); font-size: 18px; font-weight: 600; }
  .faq-q svg { width: 18px; height: 18px; flex-shrink: 0; transition: transform 0.25s var(--ease); color: var(--color-gold); }
  .faq-item.open .faq-q svg { transform: rotate(45deg); }
  .faq-a { max-height: 0; overflow: hidden; transition: max-height 0.3s var(--ease); color: var(--color-ink-soft); font-size: 14.5px; line-height: 1.8; }
  .faq-item.open .faq-a { max-height: 300px; }
  .faq-a-inner { padding: 0 4px 22px; }
</style>

<script>
const FAQS = [
  { q: 'สั่งซื้อสินค้าอย่างไร?', a: 'เลือกสินค้าที่ต้องการ กด "เพิ่มลงตะกร้า" จากนั้นไปที่หน้าตะกร้าสินค้าเพื่อตรวจสอบรายการ แล้วกด "ดำเนินการชำระเงิน" กรอกข้อมูลจัดส่งและเลือกวิธีชำระเงินให้ครบถ้วน' },
  { q: 'มีวิธีการชำระเงินแบบใดบ้าง?', a: 'รองรับการโอนผ่านธนาคาร, พร้อมเพย์ (สแกน QR Code), และบัตรเครดิต/เดบิต' },
  { q: 'จัดส่งสินค้ากี่วัน?', a: 'โดยทั่วไปจัดส่งภายใน 3-7 วันทำการ ขึ้นอยู่กับพื้นที่ปลายทางและประเภทสินค้า (เฟอร์นิเจอร์ชิ้นใหญ่อาจใช้เวลานานกว่าปกติ)' },
  { q: 'สามารถคืนหรือเปลี่ยนสินค้าได้หรือไม่?', a: 'สามารถแจ้งคืน/เปลี่ยนสินค้าได้ภายใน 7 วันหลังได้รับสินค้า โดยสินค้าต้องอยู่ในสภาพสมบูรณ์ พร้อมบรรจุภัณฑ์เดิม' },
  { q: 'มีหน้าร้านให้ดูสินค้าจริงไหม?', a: 'มีโชว์รูมที่ถนนสุขุมวิท กรุงเทพฯ เปิดให้เข้าชมทุกวัน 9:00–20:00 น. แนะนำให้ทักแชทนัดหมายล่วงหน้า' },
  { q: 'ติดตามสถานะคำสั่งซื้อได้ที่ไหน?', a: 'เข้าสู่ระบบและไปที่เมนู "ประวัติคำสั่งซื้อ" ในบัญชีของคุณ เพื่อดูสถานะล่าสุดแบบเรียลไทม์' },
];
document.getElementById('faq-list').innerHTML = FAQS.map((f, i) => `
  <div class="faq-item ${i === 0 ? 'open' : ''}">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">
      <span>${f.q}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
    </div>
    <div class="faq-a"><div class="faq-a-inner">${f.a}</div></div>
  </div>`).join('');
</script>
</body>
