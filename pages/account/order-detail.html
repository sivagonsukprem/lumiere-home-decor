.od-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 8px; }
.od-line-item { display: flex; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--color-line-soft); }
.od-line-item img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0; }
.od-line-item .n { font-family: var(--font-serif); font-weight: 600; font-size: 15px; }
.od-line-item .q { font-size: 12.5px; color: var(--color-ink-faint); }
.od-line-item .p { margin-left: auto; font-weight: 600; font-size: 14px; white-space: nowrap; }

.od-timeline { display: flex; flex-direction: column; gap: 0; margin-top: 10px; }
.od-tl-item { display: flex; gap: 16px; position: relative; padding-bottom: 30px; }
.od-tl-item:last-child { padding-bottom: 0; }
.od-tl-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--color-line-soft); color: var(--color-ink-faint); display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 2; }
.od-tl-dot svg { width: 15px; height: 15px; }
.od-tl-item.done .od-tl-dot { background: var(--color-success); color: #fff; }
.od-tl-item.current .od-tl-dot { background: var(--color-ink); color: #fff; }
.od-tl-line { position: absolute; left: 13.5px; top: 28px; bottom: 0; width: 1.5px; background: var(--color-line); }
.od-tl-item.done .od-tl-line { background: var(--color-success); }
.od-tl-item:last-child .od-tl-line { display: none; }
.od-tl-label { font-weight: 600; font-size: 14.5px; padding-top: 4px; }
.od-tl-item:not(.done):not(.current) .od-tl-label { color: var(--color-ink-faint); font-weight: 500; }
.od-cancelled-box { text-align: center; padding: 40px 20px; background: var(--color-danger-bg); border-radius: var(--radius-md); color: var(--color-danger); }
.od-cancelled-box svg { width: 40px; height: 40px; margin: 0 auto 12px; }
.od-empty { text-align: center; padding: 80px 0; }
</style>

<script>
const params = new URLSearchParams(window.location.search);
const orderNo = params.get('order');
const order = LH.getOrders().find(o => o.no === orderNo);
const contentEl = document.getElementById('od-content');

if (orderNo) document.getElementById('bc-orderno').textContent = orderNo;

if (!order) {
  contentEl.innerHTML = `
    <div class="dash-card od-empty">
      <h3 style="margin-bottom:10px;">ไม่พบคำสั่งซื้อนี้</h3>
      <p style="color:var(--color-ink-soft); margin-bottom:26px;">ตรวจสอบหมายเลขคำสั่งซื้ออีกครั้ง หรือกลับไปดูประวัติคำสั่งซื้อทั้งหมด</p>
      <a href="orders.html" class="btn btn-primary">กลับไปประวัติคำสั่งซื้อ</a>
    </div>`;
} else {
  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';

  const seed = order.no.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const lineItemCount = order.items || 1;
  const lineItems = [];
  for (let i = 0; i < lineItemCount; i++) {
    const p = PRODUCTS[(seed + i * 7) % PRODUCTS.length];
    const qty = ((seed + i) % 3) + 1;
    lineItems.push({ p, qty });
  }
  const subtotal = lineItems.reduce((sum, li) => sum + li.p.price * li.qty, 0);
  const shipping = order.total - subtotal;

  const shippingBlock = `
    <div class="dash-card">
      <h3>ที่อยู่จัดส่ง</h3>
      <div style="font-size:14px; color:var(--color-ink-soft); line-height:1.9;">
        <div style="color:var(--color-ink); font-weight:600; margin-bottom:4px;">สมชาย ใจดี · 089-123-4567</div>
        123/45 ซอยสุขุมวิท 21 ถนนสุขุมวิท แขวงคลองตันเหนือ<br>
        เขตวัฒนา กรุงเทพมหานคร 10110
      </div>
    </div>`;

  const itemsBlock = `
    <div class="dash-card">
      <h3>รายการสินค้า</h3>
      ${lineItems.map(li => `
        <div class="od-line-item">
          <img src="${li.p.img}" alt="${li.p.name}">
          <div>
            <div class="n">${li.p.name}</div>
            <div class="q">จำนวน ${li.qty}</div>
          </div>
          <div class="p">${formatTHB(li.p.price * li.qty)}</div>
        </div>
      `).join('')}
      <div class="summary-row" style="padding-top:18px;"><span>ยอดรวมสินค้า</span><span>${formatTHB(subtotal)}</span></div>
      <div class="summary-row"><span>ค่าจัดส่ง</span><span>${shipping <= 0 ? 'ฟรี' : formatTHB(shipping)}</span></div>
      <div class="summary-row total"><span>ยอดรวมทั้งหมด</span><span class="val">${formatTHB(order.total)}</span></div>
    </div>`;

  let timelineBlock;
  if (order.status === 'cancelled') {
    timelineBlock = `
      <div class="dash-card">
        <h3>สถานะคำสั่งซื้อ</h3>
        <div class="od-cancelled-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M9 9l6 6m0-6l-6 6"/></svg>
          <div style="font-weight:600; font-size:16px; margin-bottom:6px;">คำสั่งซื้อนี้ถูกยกเลิก</div>
          <div style="font-size:13.5px;">หากมีข้อสงสัยกรุณาติดต่อทีมงานผ่าน LINE หรืออีเมลของเรา</div>
        </div>
      </div>`;
  } else {
    const steps = [
      { key: 'pending', label: 'รอชำระเงิน' },
      { key: 'paid', label: 'ชำระเงินแล้ว' },
      { key: 'processing', label: 'กำลังเตรียมสินค้า' },
      { key: 'shipping', label: 'จัดส่งแล้ว' },
      { key: 'completed', label: 'สำเร็จ' },
    ];
    const currentIdx = steps.findIndex(s => s.key === order.status);
    timelineBlock = `
      <div class="dash-card">
        <h3>สถานะคำสั่งซื้อ</h3>
        <div class="od-timeline">
          ${steps.map((s, i) => {
            const cls = i < currentIdx ? 'done' : (i === currentIdx ? 'current' : '');
            return `
            <div class="od-tl-item ${cls}">
              <div class="od-tl-line"></div>
              <div class="od-tl-dot">${i <= currentIdx ? checkIcon : (i + 1)}</div>
              <div class="od-tl-label">${s.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  contentEl.innerHTML = `
    <div class="dash-card">
      <div class="od-head">
        <div>
          <div style="font-family:var(--font-serif); font-size:22px; font-weight:600;">${order.no}</div>
          <div style="font-size:13px; color:var(--color-ink-faint); margin-top:4px;">สั่งซื้อเมื่อ ${LH.formatDate(order.date)}</div>
        </div>
        <span class="status-badge status-${order.status}">${LH.statusLabel(order.status)}</span>
      </div>
    </div>
    ${timelineBlock}
    ${shippingBlock}
    ${itemsBlock}
  `;
}
</script>
